const FL=[["Un señor en patineta eléctrica vende gelatinas, 3 por $20. Compras seis.","A guy on an electric scooter sells jello cups, 3 for $20. You buy six."],["Tu tía te manda una cadena de WhatsApp: si no la reenvías, 7 años de mala suerte. La reenvías, por si acaso.","Your aunt sends you a WhatsApp chain: forward it or 7 years of bad luck. You forward it, just in case."],["Pasa volando un dron de tacos. Era tu antiguo trabajo. Le haces una seña muy mexicana.","A taco drone flies by. That was your old job. You give it a very Mexican hand gesture."],["Unos niños juegan a «policías y Don Chuys». Nadie quiere ser Don Chuy.","Some kids are playing “cops and Don Chuys”. Nobody wants to be Don Chuy."],["Un vendedor de tiempos compartidos te persigue dos cuadras. Es más peligroso que la policía.","A timeshare salesman chases you for two blocks. He's more dangerous than the cops."],["En la radio: «Hoy 40 grados en Mérida. Sensación térmica: infierno con humedad».","On the radio: “40°C in Mérida today. Feels like: hell, but humid.”"],["Un mariachi robot te canta «Las Mañanitas» por error. Le das propina igual.","A robot mariachi sings you a birthday song by mistake. You tip him anyway."],["El metro se detiene 20 minutos. Nadie sabe por qué. Nadie pregunta.","The subway stops for 20 minutes. Nobody knows why. Nobody asks."],["Un señor vende tamales a las 3 de la mañana. Dudas, pero compras uno.","A man sells tamales at 3 a.m. You hesitate, then buy one."],["Suena una cumbia a todo volumen desde un vocho.","A cumbia blasts from a beat-up VW Beetle."],["Un perro callejero te sigue cinco cuadras. Ya es tu compa.","A stray dog follows you for five blocks. He's your buddy now."],["Pasa un mariachi y te mira como si supiera algo.","A mariachi walks by and looks at you like he knows something."],["Ves a un tira comiendo tacos de canasta. Respiras tranquilo.","You see a cop eating basket tacos. You breathe easy."],["El Jefe Narc dice que ‘esto es personal’.","The Narc Chief says 'this is personal'."],["Un aguacatero grita: ‘¡Aguacate, lleve su aguacate!’","An avocado seller shouts: 'Avocados! Get your avocados!'"],["Un abuelito te vende un cachito de lotería “ganador”.","An old man sells you a “winning” lottery ticket."],["Se corta la luz. Nadie se sorprende.","The power goes out. Nobody is surprised."],["Huele a cochinita pibil a tres cuadras. Se te antoja.","You can smell cochinita pibil from three blocks away. You're hungry."],["Un señor te dice «Bix a beel» y no sabes qué contestar.","A man greets you with “Bix a beel” and you don't know what to say."],["Alguien presume su habanero: «Este sí pica, compadre».","Someone brags about his habanero: “This one really burns, compadre.”"],["Un influencer te graba para su live: «¡Chat, miren esta locura!». Tú te tapas la cara.","An influencer films you for his livestream: “Chat, look at this madness!” You cover your face."],["Un cocodrilo se cuela en una alberca. Nadie se asusta.","A crocodile slips into a swimming pool. Nobody panics."],["Un yate gigante pasa con música a todo volumen y gente bailando en la cubierta.","A giant yacht cruises by with blasting music and people dancing on deck."],["Un tipo en un jet ski persigue a otro por el canal. Todos graban.","A guy on a jet ski chases another down the canal. Everybody films it."],["En la radio: «Otra semana sin que nadie respete un semáforo. ¡Así se vive!»","On the radio: “Another week without anyone obeying a red light. That's living!”"],["Una influencer baila frente a una patrulla. La patrulla sale en el video.","An influencer dances in front of a patrol car. The patrol car is in the video."],["Alguien se casa en un casino de neón. Los invitados llegan en carritos de golf.","Someone is getting married in a neon casino. Guests arrive in golf carts."]];

 else{const l=Math.round(S.cash*.3),h=ri(15,35);S.cash-=l;S.hp-=h;S.wanted=Math.min(5,(S.wanted||0)+2);S.log.push(T(`El golpe se fue al diablo: escapas herido (−${h}% de salud) y pierdes ${m(l)}. ¡Te buscan en todo el estado!`,`The heist went south: you escape wounded (−${h}% health) and lose ${m(l)}. They're after you statewide!`));vib([200,100,200])}}
function woman(ok){if(!ok){S.log.push(T("Ignoraste a la chica que te coqueteaba. Quién sabe qué querría.","You ignored the girl flirting with you. Who knows what she wanted."));return}
 if(Math.random()<.85){S.heart=1;robbery("love")}
 else{S.hp=Math.min(100,S.hp+20);const g=ri(300,900);S.cash+=g;S.log.push(T(`Resultó ser sincera: se tomaron unos tragos, te curó las heridas (+20% de salud) y te regaló ${m(g)}. ¡Qué suerte!`,`She turned out to be sincere: you had drinks, she patched you up (+20% health) and gave you ${m(g)}. What luck!`))}}
function hobo(ok){if(!ok){S.log.push(T("Ignoraste al vagabundo. Se fue murmurando.","You ignored the hobo. He walked away muttering."));return}
 if(Math.random()<.65){S.lethal=1;const i=rnd(D.length),f=S.space-used(),q=Math.min(f,ri(15,40));if(q>0){const h=S.inv[i]||{q:0,c:0};h.q+=q;S.inv[i]=h}
  S.log.push(T(`El vagabundo te dio un arma letal que nunca falla (úsala la próxima vez que te topes con la policía)${q>0?` y ${q} de ${dn(i)} para vender`:""}. «Cuídala, joven.»`,`The hobo gave you a lethal weapon that never misses (use it the next time you meet the police)${q>0?` and ${q} ${dn(i)} to sell`:""}. “Take care of it, kid.”`));snd(650)}
 else{const l=S.cash;S.cash=0;S.log.push(T(`¡Era una trampa! El vagabundo te asaltó y se llevó todo tu efectivo (${m(l)}).`,`It was a trap! The hobo mugged you and took all your cash (${m(l)}).`));vib(250)}}
function luck(i,q,h){if(q<4||Math.random()>=(S.lk>0?.3:.14))return;const f=S.space-used(),x=Math.min(f,Math.round(q*(.25+Math.random()*.25)));if(x<1)return;h.q+=x;S.inv[i]=h;S.log.push(T(`¡Agarraste enfiestado al dealer! Te dio ${x} de ${dn(i)} de más (+${Math.round(x/q*100)}%).`,`You caught the dealer partying! He threw in ${x} extra ${dn(i)} (+${Math.round(x/q*100)}%).`));snd(800)}
const dm=d=>S.vest?Math.ceil(d/2):d;
function cop(a){const M=S.m;
 if(a==="run"){if(Math.random()<(S.car?.75:.5)){S.wanted=Math.min(5,(S.wanted||0)+1);S.m=null;S.log.push(T("¡Te pelaste por un callejón!","You slipped away down an alley!"));snd(500)}else{const d=dm(ri(4,10)*M.n);S.hp-=d;M.msg=T(`No escapaste. Te disparan: −${d}% de salud.`,`You didn't get away. They shoot you: −${d}% health.`);vib(250)}}
 if(a==="fight"){S.wanted=Math.min(5,(S.wanted||0)+1);let k=0;const sh=Math.min(S.guns,M.n);for(let g=0;g<sh;g++)if(Math.random()<.55){M.n--;k++;S.kills=(S.kills||0)+1}S.guns-=sh;const gs=T(` Gastaste ${sh} arma${sh>1?"s":""}: te quedan ${S.guns}.`,` You used ${sh} gun${sh>1?"s":""}: ${S.guns} left.`);
  if(M.n<=0){const w=ri(300,1500);S.cash+=w;S.m=null;S.log.push(T(`¡Los abatiste! Les quitas ${m(w)}.`,`You took them down! You take ${m(w)} off them.`)+gs);snd(600)}
  else{let d=0;for(let c=0;c<M.n;c++)if(Math.random()<.5)d+=ri(5,12);d=dm(d);S.hp-=d;M.msg=T(`Derribaste ${k}. Quedan ${M.n}. Recibes ${d}% de daño.`,`You downed ${k}. ${M.n} left. You take ${d}% damage.`)+gs;vib(250)}}
 if(a==="lethal"){const w=ri(300,1500)*M.n+500;S.cash+=w;S.m=null;S.lethal=0;S.lethalUsed=1;S.wanted=Math.min(5,(S.wanted||0)+2);S.log.push(T(`☠ ¡El arma del vagabundo no falla! Acabas con los ${M.n} agentes y les quitas ${m(w)}. ¡Ahora te buscan más!`,`☠ The hobo's weapon never misses! You take down all ${M.n} agents and take ${m(w)} off them. Now they're after you even more!`));snd(300,.4,"sawtooth");vib([200,80,200])}
 if(a==="bribe"){if(S.cash<50){S.m=null;S.log.push(T("Te escarbaron los bolsillos y no traías ni para un taco. Se rieron y te dejaron ir.","They searched your pockets and you didn't even have taco money. They laughed and let you go."))}else{M.neg=1;M.tries=0;M.need=Math.round(S.cash*(Math.random()<.5?.15:.2));M.msg=T("Los policías quieren “su parte”. Ofrece un porcentaje o una cantidad… pero no te pases de codo.","The cops want “their cut”. Offer a percentage or an amount… but don't be stingy.")}}

function offer(ok){const M=S.m;S.m=null;

function openTr(i){if(!S.pr[i]&&!S.inv[i])return;S.m={t:"tr",i,mode:S.inv[i]&&S.pr[i]?"sell":"buy",q:1};draw()}
function trMax(){const M=S.m,p=S.pr[M.i];if(M.mode==="buy")return p?Math.max(0,Math.min(Math.floor(S.cash/p),S.space-used())):0;return S.inv[M.i]&&p?S.inv[M.i].q:0}
function setMode(x){S.m.mode=x;S.m.q=Math.max(1,trMax());draw()}
function setQ(v,src){const mx=trMax();S.m.q=Math.max(1,Math.min(mx,Math.floor(+v||1)));const a=$("#qi"),b=$("#qr");if(a&&a!==src)a.value=S.m.q;if(b&&b!==src)b.value=S.m.q;trLbl()}
function adjQ(d){setQ(S.m.q+d)}
function trLbl(){if(!S||!S.m||S.m.t!=="tr")return;const M=S.m,p=S.pr[M.i];const e=$("#tq");if(e)e.textContent=M.q+" × "+m(p)+" = "+m(M.q*p)}
function doTr(){const M=S.m,i=M.i,p=S.pr[i],q=M.q;if(!q||!p)return;let h=S.inv[i]||{q:0,c:0};
 if(M.mode==="buy"){S.cash-=p*q;h.q+=q;h.c+=p*q;S.inv[i]=h;S.log=[T(`Compraste ${q} de ${dn(i)} por ${m(p*q)}.`,`You bought ${q} ${dn(i)} for ${m(p*q)}.`)];luck(i,q,h);snd(440)}
 else{const a=h.q?h.c/h.q:0,g=Math.round(q*(p-a));S.best=Math.max(S.best||0,g);S.cash+=p*q;h.c-=a*q;h.q-=q;if(h.q<=0)delete S.inv[i];else S.inv[i]=h;S.log=[T(`Vendiste ${q} de ${dn(i)} por ${m(p*q)}. ${g>=0?"Ganancia":"Pérdida"}: ${m(Math.abs(g))}.`,`You sold ${q} ${dn(i)} for ${m(p*q)}. ${g>=0?"Profit":"Loss"}: ${m(Math.abs(g))}.`)];snd(g>=0?700:200)}
 S.m=null;sv("nw",S);draw()}

 if(a==="pay"){x=Math.min(v||1e12,S.cash,S.debt);S.cash-=x;S.debt-=x;S.log=[T(`Pagaste ${m(x)} de tu deuda.`,`You paid ${m(x)} of your debt.`)+(S.debt<=0?T(" Don Chuy: «Hasta que pagas, pelana. Piérdete.»"," Don Chuy: “About time, pelana. Get lost.”"):T(" Don Chuy: «Eso apenas son los intereses, pelana.»"," Don Chuy: “That's barely the interest, pelana.”"))]}
 if(a==="dep"){x=Math.min(v||1e12,S.cash);S.cash-=x;S.bank+=x;S.log=[T(`Depositaste ${m(x)} (interés 5% diario).`,`You deposited ${m(x)} (5% daily interest).`)]}
 if(a==="wd"){x=Math.min(v||1e12,S.bank);S.cash+=x;S.bank-=x;S.log=[T(`Retiraste ${m(x)} del banco.`,`You withdrew ${m(x)} from the bank.`)]}
 if(a==="loan"){if(S.day>=S.len){S.log=[T("Don Chuy ya no te contesta: se acabó el tiempo, pelana.","Don Chuy won't pick up anymore: time's up, pelana.")]}else{x=Math.min(v||5000,10000);S.cash+=x;S.debt+=Math.round(x*1.1);S.loans=(S.loans||0)+1;S.log=[T(S.loans>1?`Don Chuy te presta ${m(x)} escupiendo: «¿Otra vez, pelana? Toma tu lana y no me hagas ir por ti.»`:`Don Chuy te presta ${m(x)} de mala gana: «Aquí está, pelana. Y la comisión del 10% va aparte.»`,S.loans>1?`Don Chuy lends you ${m(x)}, spitting: “Again, pelana? Take your cash and don't make me come get you.”`:`Don Chuy lends you ${m(x)} reluctantly: “Here you go, pelana. And the 10% fee is extra.”`)]}}
 S.m=null;snd(480);sv("nw",S);draw()}
